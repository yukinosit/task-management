<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduTask Hub Pro - 統合課題管理システム</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <!-- FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Google API Client & Identity Services -->
  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="https://apis.google.com/js/api.js"></script>

  <style>
    .fc-event { cursor: pointer; border-radius: 4px; padding: 2px 4px; font-size: 0.85rem; }
    .status-border-todo { border-left: 5px solid #ef4444; }
    .status-border-doing { border-left: 5px solid #f59e0b; }
    .status-border-submitted { border-left: 5px solid #3b82f6; }
    .status-border-done { border-left: 5px solid #10b981; }
    .status-border-overdue { border-left: 5px solid #7c3aed; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header & Main Navigation -->
  <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-graduation-cap text-2xl text-yellow-300"></i>
        <h1 class="text-xl font-bold tracking-wide">EduTask Hub Pro</h1>
      </div>

      <!-- Main Navigation Tabs -->
      <nav class="flex space-x-1 bg-indigo-800 p-1 rounded-lg text-sm font-medium">
        <button onclick="switchTab('tasks')" id="tab-tasks" class="tab-btn px-4 py-2 rounded-md bg-indigo-600 text-white shadow">
          <i class="fa-solid fa-list-check mr-2"></i>課題一覧・管理
        </button>
        <button onclick="switchTab('calendar')" id="tab-calendar" class="tab-btn px-4 py-2 rounded-md text-indigo-200 hover:text-white">
          <i class="fa-regular fa-calendar-days mr-2"></i>カレンダー
        </button>
        <button onclick="switchTab('integrations')" id="tab-integrations" class="tab-btn px-4 py-2 rounded-md text-indigo-200 hover:text-white">
          <i class="fa-solid fa-cloud-arrow-down mr-2"></i>外部連携・Google
        </button>
        <button onclick="switchTab('analytics')" id="tab-analytics" class="tab-btn px-4 py-2 rounded-md text-indigo-200 hover:text-white">
          <i class="fa-solid fa-chart-pie mr-2"></i>統計・レポート
        </button>
      </nav>

      <div class="flex items-center gap-2">
        <!-- 通知許可ボタン -->
        <button onclick="requestNotificationPermission()" id="btn-notification" class="bg-indigo-800 hover:bg-indigo-900 text-yellow-300 font-bold px-3 py-2 rounded-lg text-xs flex items-center gap-2 border border-indigo-500">
          <i class="fa-solid fa-bell"></i> <span id="noti-btn-text">通知を有効化</span>
        </button>
        <button onclick="openModal()" class="bg-amber-400 hover:bg-amber-300 text-indigo-950 font-bold px-4 py-2 rounded-lg shadow transition flex items-center gap-2 text-sm">
          <i class="fa-solid fa-plus"></i> 新規課題を追加
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

    <!-- SECTION 1: 課題一覧・管理 -->
    <section id="section-tasks" class="tab-content block space-y-6">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
        <div class="flex flex-wrap gap-3 items-center w-full md:w-auto">
          <div class="relative w-full md:w-64">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
            <input type="text" id="searchQuery" oninput="renderTasks()" placeholder="課題名や教科で検索..." class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <select id="filterSubject" onchange="renderTasks()" class="border rounded-lg px-3 py-2 text-sm outline-none">
            <option value="ALL">全ての教科</option>
            <option value="数学">数学</option>
            <option value="英語">英語</option>
            <option value="国語">国語</option>
            <option value="理科">理科</option>
            <option value="社会">社会</option>
            <option value="情報/その他">情報/その他</option>
          </select>
          <select id="filterSource" onchange="renderTasks()" class="border rounded-lg px-3 py-2 text-sm outline-none">
            <option value="ALL">提出場所: すべて</option>
            <option value="Google Classroom">Google Classroom</option>
            <option value="Microsoft Teams">Microsoft Teams</option>
            <option value="手渡し・紙">手渡し・紙</option>
            <option value="その他Web">その他Web</option>
          </select>
        </div>

        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-500 font-bold">表示切替:</span>
          <button onclick="setViewMode('kanban')" id="btn-kanban" class="px-3 py-1.5 rounded-lg border text-sm bg-indigo-50 border-indigo-200 text-indigo-700 font-medium">カンバン</button>
          <button onclick="setViewMode('list')" id="btn-list" class="px-3 py-1.5 rounded-lg border text-sm bg-white border-slate-200 text-slate-600">リスト</button>
        </div>
      </div>

      <!-- KANBAN BOARD -->
      <div id="view-kanban" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-slate-200/60 p-3 rounded-xl">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-slate-700 flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full bg-red-500"></span>未着手</h3>
            <span id="count-todo" class="bg-white text-slate-600 px-2 py-0.5 rounded-full text-xs font-bold shadow-sm">0</span>
          </div>
          <div id="container-todo" class="space-y-3 min-h-[300px]"></div>
        </div>

        <div class="bg-slate-200/60 p-3 rounded-xl">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-slate-700 flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full bg-amber-500"></span>進行中</h3>
            <span id="count-doing" class="bg-white text-slate-600 px-2 py-0.5 rounded-full text-xs font-bold shadow-sm">0</span>
          </div>
          <div id="container-doing" class="space-y-3 min-h-[300px]"></div>
        </div>

        <div class="bg-slate-200/60 p-3 rounded-xl">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-slate-700 flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full bg-blue-500"></span>提出済み</h3>
            <span id="count-submitted" class="bg-white text-slate-600 px-2 py-0.5 rounded-full text-xs font-bold shadow-sm">0</span>
          </div>
          <div id="container-submitted" class="space-y-3 min-h-[300px]"></div>
        </div>

        <div class="bg-slate-200/60 p-3 rounded-xl">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-slate-700 flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full bg-emerald-500"></span>完了</h3>
            <span id="count-done" class="bg-white text-slate-600 px-2 py-0.5 rounded-full text-xs font-bold shadow-sm">0</span>
          </div>
          <div id="container-done" class="space-y-3 min-h-[300px]"></div>
        </div>
      </div>

      <!-- LIST VIEW -->
      <div id="view-list" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-slate-700 font-bold border-b">
            <tr>
              <th class="p-3">ステータス</th>
              <th class="p-3">教科</th>
              <th class="p-3">課題タイトル</th>
              <th class="p-3">提出場所</th>
              <th class="p-3">締切日時</th>
              <th class="p-3">予想時間</th>
              <th class="p-3 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="list-table-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>

    <!-- SECTION 2: カレンダー表示 -->
    <section id="section-calendar" class="tab-content hidden">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div id="calendar"></div>
      </div>
    </section>

    <!-- SECTION 3: 外部連携 -->
    <section id="section-integrations" class="tab-content hidden space-y-6">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-3 mb-4">
          <div class="p-3 bg-emerald-100 rounded-lg text-emerald-700">
            <i class="fa-brands fa-google text-2xl"></i>
          </div>
          <div>
            <h2 class="text-lg font-bold text-slate-800">Google Classroom 自動同期</h2>
            <p class="text-xs text-slate-500">Googleアカウントと接続し、決められた課題提出期限をリアルタイムで自動取得します。</p>
          </div>
        </div>

        <div class="space-y-4 bg-slate-50 p-4 rounded-lg border">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Google OAuth Client ID</label>
              <input type="text" id="g-client-id" placeholder="xxxxxx.apps.googleusercontent.com" class="w-full border p-2 rounded text-xs">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Google API Key</label>
              <input type="text" id="g-api-key" placeholder="AIzaSyXXXXXX" class="w-full border p-2 rounded text-xs">
            </div>
          </div>
          <div class="flex gap-3 items-center">
            <button onclick="handleAuthClick()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2">
              <i class="fa-solid fa-arrows-rotate"></i> Google Classroomと連携・同期
            </button>
            <span id="gc-status" class="text-xs font-medium text-slate-500">未接続</span>
          </div>
        </div>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <h3 class="font-bold text-slate-800 mb-2 flex items-center gap-2"><i class="fa-solid fa-file-import text-indigo-600"></i>ファイルからインポート</h3>
          <p class="text-xs text-slate-500 mb-4">JSONファイルを取り込みます。</p>
          <input type="file" id="importFile" accept=".json" onchange="importTasks(event)" class="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"/>
        </div>
        <div>
          <h3 class="font-bold text-slate-800 mb-2 flex items-center gap-2"><i class="fa-solid fa-file-export text-indigo-600"></i>データ出力</h3>
          <p class="text-xs text-slate-500 mb-4">保存された課題データをJSONとして保存します。</p>
          <button onclick="exportTasks()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-4 py-2 rounded-lg">
            <i class="fa-solid fa-download mr-1"></i>JSONとしてエクスポート
          </button>
        </div>
      </div>
    </section>

    <!-- SECTION 4: 統計 -->
    <section id="section-analytics" class="tab-content hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
          <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-chart-pie text-indigo-600"></i>課題状況の分布割合</h3>
          <div class="w-64 mx-auto"><canvas id="chart-status"></canvas></div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
          <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-chart-column text-indigo-600"></i>教科別の課題負荷</h3>
          <canvas id="chart-subject"></canvas>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div id="modalTask" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
      <div class="bg-indigo-700 px-6 py-4 text-white flex justify-between items-center">
        <h3 id="modalTitle" class="font-bold">新規課題の追加</h3>
        <button onclick="closeModal()" class="text-indigo-200 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="taskForm" onsubmit="saveTask(event)" class="p-6 space-y-4">
        <input type="hidden" id="taskId">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">課題タイトル *</label>
          <input type="text" id="taskTitle" required placeholder="例: 数学ワーク P.20-25" class="w-full border p-2 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">教科 *</label>
            <select id="taskSubject" required class="w-full border p-2 rounded-lg text-sm outline-none">
              <option value="数学">数学</option>
              <option value="英語">英語</option>
              <option value="国語">国語</option>
              <option value="理科">理科</option>
              <option value="社会">社会</option>
              <option value="情報/その他">情報/その他</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">提出場所</label>
            <select id="taskSource" class="w-full border p-2 rounded-lg text-sm outline-none">
              <option value="Google Classroom">Google Classroom</option>
              <option value="Microsoft Teams">Microsoft Teams</option>
              <option value="手渡し・紙">手渡し・紙</option>
              <option value="その他Web">その他Web</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-2">進行状況 *</label>
          <input type="hidden" id="taskStatus" value="todo">
          <div class="grid grid-cols-4 gap-2">
            <button type="button" onclick="setStatusSelect('todo')" id="btn-status-todo" class="status-select-btn border-2 rounded-lg p-2 text-center text-xs font-bold">
              <i class="fa-solid fa-circle-dot text-red-500 block text-base mb-1"></i>未着手
            </button>
            <button type="button" onclick="setStatusSelect('doing')" id="btn-status-doing" class="status-select-btn border-2 rounded-lg p-2 text-center text-xs font-bold">
              <i class="fa-solid fa-spinner text-amber-500 block text-base mb-1"></i>進行中
            </button>
            <button type="button" onclick="setStatusSelect('submitted')" id="btn-status-submitted" class="status-select-btn border-2 rounded-lg p-2 text-center text-xs font-bold">
              <i class="fa-solid fa-paper-plane text-blue-500 block text-base mb-1"></i>提出済み
            </button>
            <button type="button" onclick="setStatusSelect('done')" id="btn-status-done" class="status-select-btn border-2 rounded-lg p-2 text-center text-xs font-bold">
              <i class="fa-solid fa-check-double text-emerald-500 block text-base mb-1"></i>完了
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">提出締切日時 *</label>
            <input type="datetime-local" id="taskDueDate" required class="w-full border p-2 rounded-lg text-sm outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">予想時間 (分)</label>
            <input type="number" id="taskEstTime" placeholder="30" class="w-full border p-2 rounded-lg text-sm outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">メモ</label>
          <textarea id="taskMemo" rows="2" class="w-full border p-2 rounded-lg text-sm outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-xs font-bold text-slate-600">キャンセル</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('edutask_tasks_v2')) || [
      { id: '1', title: '【Classroom】英語 Chapter 4 ワークシート提出', subject: '英語', source: 'Google Classroom', status: 'todo', dueDate: '2026-10-28T23:59', estTime: 45, memo: '提出フォームから提出' }
    ];

    let notifiedTasks = JSON.parse(localStorage.getItem('edutask_notified_v1')) || {};

    let calendarInstance = null;
    let statusChart = null;
    let subjectChart = null;

    const statusConfig = {
      todo: { label: '未着手', bg: 'bg-red-50 text-red-700 border-red-200', borderClass: 'status-border-todo', hex: '#ef4444' },
      doing: { label: '進行中', bg: 'bg-amber-50 text-amber-700 border-amber-200', borderClass: 'status-border-doing', hex: '#f59e0b' },
      submitted: { label: '提出済み', bg: 'bg-blue-50 text-blue-700 border-blue-200', borderClass: 'status-border-submitted', hex: '#3b82f6' },
      done: { label: '完了', bg: 'bg-emerald-50 text-emerald-700 border-emerald-200', borderClass: 'status-border-done', hex: '#10b981' },
      overdue: { label: '期限超過', bg: 'bg-purple-50 text-purple-700 border-purple-200', borderClass: 'status-border-overdue', hex: '#7c3aed' }
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderTasks();
      initCalendar();
      saveData();
      checkNotificationState();
      
      // 60秒ごとに期限チェックを実行
      setInterval(checkDueNotifications, 60000);
      checkDueNotifications();
    });

    function saveData() { 
      localStorage.setItem('edutask_tasks_v2', JSON.stringify(tasks));
      localStorage.setItem('edutask_notified_v1', JSON.stringify(notifiedTasks));
    }

    // --- 通知機能 Logic ---
    function checkNotificationState() {
      if ('Notification' in window) {
        if (Notification.permission === 'granted') {
          document.getElementById('noti-btn-text').innerText = '通知: ON';
          document.getElementById('btn-notification').classList.replace('bg-indigo-800', 'bg-emerald-700');
        } else if (Notification.permission === 'denied') {
          document.getElementById('noti-btn-text').innerText = '通知: ブロック中';
        }
      } else {
        document.getElementById('noti-btn-text').innerText = '通知非対応';
      }
    }

    function requestNotificationPermission() {
      if (!('Notification' in window)) {
        alert('お使いのブラウザはデスクトップ通知に対応していません。');
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          alert('通知が有効化されました！期限が近い課題をお知らせします。');
          checkNotificationState();
          checkDueNotifications();
        } else {
          alert('通知が拒否されました。ブラウザの設定から変更できます。');
          checkNotificationState();
        }
      });
    }

    function checkDueNotifications() {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;

      const now = new Date();
      const next24Hours = new Date(now.getTime() + 24 * 60 * 60 * 1000);

      tasks.forEach(task => {
        if (task.status === 'done' || task.status === 'submitted') return;

        const dueDate = new Date(task.dueDate);

        // 24時間以内の締切課題で、まだ通知していない場合
        if (dueDate > now && dueDate <= next24Hours) {
          if (!notifiedTasks[task.id]) {
            new Notification(`⏰ 課題の締切が近づいています`, {
              body: `【${task.subject}】${task.title}\n締切: ${task.dueDate.replace('T', ' ')}`,
              icon: 'https://cdn-icons-png.flaticon.com/512/2693/2693507.png'
            });
            notifiedTasks[task.id] = true;
            saveData();
          }
        }
      });
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white', 'shadow');
        btn.classList.add('text-indigo-200');
      });

      document.getElementById(`section-${tabName}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-${tabName}`);
      activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow');
      activeBtn.classList.remove('text-indigo-200');

      if (tabName === 'calendar' && calendarInstance) {
        setTimeout(() => calendarInstance.render(), 50);
      } else if (tabName === 'analytics') {
        renderAnalytics();
      }
    }

    function setViewMode(mode) {
      if (mode === 'kanban') {
        document.getElementById('view-kanban').classList.remove('hidden');
        document.getElementById('view-list').classList.add('hidden');
      } else {
        document.getElementById('view-kanban').classList.add('hidden');
        document.getElementById('view-list').classList.remove('hidden');
      }
    }

    function setStatusSelect(status) {
      document.getElementById('taskStatus').value = status;
      document.querySelectorAll('.status-select-btn').forEach(btn => btn.classList.remove('border-indigo-600', 'bg-indigo-50'));
      const selected = document.getElementById(`btn-status-${status}`);
      if (selected) selected.classList.add('border-indigo-600', 'bg-indigo-50');
    }

    function openModal(taskId = null) {
      document.getElementById('taskForm').reset();
      if (taskId) {
        const task = tasks.find(t => t.id === taskId);
        if (task) {
          document.getElementById('taskId').value = task.id;
          document.getElementById('taskTitle').value = task.title;
          document.getElementById('taskSubject').value = task.subject;
          document.getElementById('taskSource').value = task.source;
          document.getElementById('taskDueDate').value = task.dueDate;
          document.getElementById('taskEstTime').value = task.estTime || '';
          document.getElementById('taskMemo').value = task.memo || '';
          setStatusSelect(task.status);
        }
      } else {
        document.getElementById('taskId').value = '';
        setStatusSelect('todo');
      }
      document.getElementById('modalTask').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('modalTask').classList.add('hidden'); }

    function saveTask(e) {
      e.preventDefault();
      const id = document.getElementById('taskId').value || Date.now().toString();
      const newTask = {
        id,
        title: document.getElementById('taskTitle').value,
        subject: document.getElementById('taskSubject').value,
        source: document.getElementById('taskSource').value,
        status: document.getElementById('taskStatus').value,
        dueDate: document.getElementById('taskDueDate').value,
        estTime: document.getElementById('taskEstTime').value ? parseInt(document.getElementById('taskEstTime').value) : 0,
        memo: document.getElementById('taskMemo').value
      };

      const index = tasks.findIndex(t => t.id === id);
      if (index >= 0) tasks[index] = newTask;
      else tasks.push(newTask);

      saveData();
      renderTasks();
      if (calendarInstance) updateCalendarEvents();
      checkDueNotifications();
      closeModal();
    }

    function deleteTask(id) {
      if (confirm('この課題を削除しますか？')) {
        tasks = tasks.filter(t => t.id !== id);
        delete notifiedTasks[id];
        saveData();
        renderTasks();
        if (calendarInstance) updateCalendarEvents();
      }
    }

    function renderTasks() {
      const q = (document.getElementById('searchQuery').value || '').toLowerCase();
      const subjectFilter = document.getElementById('filterSubject').value;
      const sourceFilter = document.getElementById('filterSource').value;

      const filtered = tasks.filter(t => {
        const matchQ = t.title.toLowerCase().includes(q) || t.subject.toLowerCase().includes(q);
        const matchSub = subjectFilter === 'ALL' || t.subject === subjectFilter;
        const matchSrc = sourceFilter === 'ALL' || t.source === sourceFilter;
        return matchQ && matchSub && matchSrc;
      });

      ['todo', 'doing', 'submitted', 'done'].forEach(s => {
        const el = document.getElementById(`container-${s}`);
        if (el) el.innerHTML = '';
      });

      let counts = { todo: 0, doing: 0, submitted: 0, done: 0 };
      const now = new Date();

      filtered.forEach(task => {
        if (counts[task.status] !== undefined) counts[task.status]++;
        const isOverdue = new Date(task.dueDate) < now && task.status !== 'done' && task.status !== 'submitted';
        const stConf = isOverdue ? statusConfig.overdue : (statusConfig[task.status] || statusConfig.todo);

        const card = document.createElement('div');
        card.className = `bg-white p-3 rounded-lg shadow-sm border border-slate-200 ${stConf.borderClass} space-y-2 relative`;
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <span class="text-xs font-bold px-2 py-0.5 rounded ${stConf.bg}">${isOverdue ? '期限超過' : stConf.label}</span>
            <span class="text-xs text-slate-400 font-medium">${task.subject}</span>
          </div>
          <h4 class="text-sm font-bold text-slate-800 leading-snug">${task.title}</h4>
          <div class="text-xs text-slate-500 space-y-1">
            <div><i class="fa-regular fa-clock"></i> ${(task.dueDate || '').replace('T', ' ')}</div>
            <div><i class="fa-solid fa-link"></i> ${task.source}</div>
          </div>
          <div class="pt-2 border-t flex justify-between items-center text-xs">
            <span class="text-slate-400"><i class="fa-solid fa-hourglass-half"></i> ${task.estTime}分</span>
            <div class="flex gap-2">
              <button onclick="openModal('${task.id}')" class="text-indigo-600"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteTask('${task.id}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
        const container = document.getElementById(`container-${task.status}`);
        if (container) container.appendChild(card);
      });

      Object.keys(counts).forEach(s => {
        const countEl = document.getElementById(`count-${s}`);
        if (countEl) countEl.innerText = counts[s];
      });

      const listBody = document.getElementById('list-table-body');
      if (listBody) {
        listBody.innerHTML = '';
        filtered.forEach(task => {
          const isOverdue = new Date(task.dueDate) < now && task.status !== 'done' && task.status !== 'submitted';
          const stConf = isOverdue ? statusConfig.overdue : (statusConfig[task.status] || statusConfig.todo);
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50';
          tr.innerHTML = `
            <td class="p-3"><span class="text-xs font-bold px-2 py-1 rounded ${stConf.bg}">${isOverdue ? '期限超過' : stConf.label}</span></td>
            <td class="p-3 font-medium">${task.subject}</td>
            <td class="p-3 font-bold text-slate-800">${task.title}</td>
            <td class="p-3">${task.source}</td>
            <td class="p-3">${(task.dueDate || '').replace('T', ' ')}</td>
            <td class="p-3">${task.estTime}分</td>
            <td class="p-3 text-right space-x-2">
              <button onclick="openModal('${task.id}')" class="text-indigo-600"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteTask('${task.id}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
            </td>
          `;
          listBody.appendChild(tr);
        });
      }
    }

    function initCalendar() {
      const calendarEl = document.getElementById('calendar');
      if (!calendarEl) return;
      calendarInstance = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ja',
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
        events: getCalendarEvents(),
        eventClick: (info) => openModal(info.event.id)
      });
      calendarInstance.render();
    }

    function getCalendarEvents() {
      const now = new Date();
      return tasks.map(t => {
        const isOverdue = new Date(t.dueDate) < now && t.status !== 'done' && t.status !== 'submitted';
        const hex = isOverdue ? statusConfig.overdue.hex : (statusConfig[t.status] ? statusConfig[t.status].hex : '#666');
        return {
          id: t.id,
          title: `[${t.subject}] ${t.title}`,
          start: t.dueDate,
          backgroundColor: hex,
          borderColor: hex
        };
      });
    }

    function updateCalendarEvents() {
      if (!calendarInstance) return;
      calendarInstance.removeAllEvents();
      calendarInstance.addEventSource(getCalendarEvents());
    }

    function renderAnalytics() {
      const ctxStatus = document.getElementById('chart-status');
      const ctxSubject = document.getElementById('chart-subject');
      if (!ctxStatus || !ctxSubject) return;

      if (statusChart) statusChart.destroy();
      if (subjectChart) subjectChart.destroy();

      const counts = { todo: 0, doing: 0, submitted: 0, done: 0 };
      const subCounts = {};

      tasks.forEach(t => {
        if (counts[t.status] !== undefined) counts[t.status]++;
        subCounts[t.subject] = (subCounts[t.subject] || 0) + 1;
      });

      statusChart = new Chart(ctxStatus, {
        type: 'doughnut',
        data: {
          labels: ['未着手', '進行中', '提出済み', '完了'],
          datasets: [{ data: [counts.todo, counts.doing, counts.submitted, counts.done], backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#10b981'] }]
        }
      });

      subjectChart = new Chart(ctxSubject, {
        type: 'bar',
        data: {
          labels: Object.keys(subCounts),
          datasets: [{ label: '課題数', data: Object.values(subCounts), backgroundColor: '#6366f1' }]
        },
        options: { scales: { y: { beginAtZero: true } } }
      });
    }

    function exportTasks() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `edutask_backup.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importTasks(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            tasks = imported;
            saveData();
            renderTasks();
            alert('取り込み完了しました。');
          }
        } catch(err) {
          alert('JSON形式エラー');
        }
      };
      reader.readAsText(file);
    }

    function handleAuthClick() {
      const clientId = document.getElementById('g-client-id').value;
      const apiKey = document.getElementById('g-api-key').value;

      if (!clientId || !apiKey) {
        alert('Client ID と API Key を入力してください。');
        return;
      }

      if (typeof gapi === 'undefined' || typeof google === 'undefined') {
        alert('Google API ライブラリの読み込み中です。数秒後にお試しください。');
        return;
      }

      gapi.load('client', async () => {
        try {
          await gapi.client.init({ apiKey: apiKey, discoveryDocs: ["https://classroom.googleapis.com/$discovery/rest?version=v1"] });
          const tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: 'https://www.googleapis.com/auth/classroom.courses.readonly https://www.googleapis.com/auth/classroom.coursework.me.readonly',
            callback: async (resp) => {
              if (resp.error) return;
              document.getElementById('gc-status').innerText = '接続済み - 自動同期中...';
              document.getElementById('gc-status').className = 'text-xs font-bold text-emerald-600';
              fetchClassroomCourseWork();
            }
          });
          tokenClient.requestAccessToken({ prompt: 'consent' });
        } catch(err) {
          alert('初期化エラー: APIキーをご確認ください。');
        }
      });
    }

    async function fetchClassroomCourseWork() {
      try {
        const coursesResp = await gapi.client.classroom.courses.list({ courseStates: ['ACTIVE'] });
        const courses = coursesResp.result.courses || [];
        
        for (const course of courses) {
          const workResp = await gapi.client.classroom.courses.courseWork.list({ courseId: course.id });
          const works = workResp.result.courseWork || [];

          works.forEach(w => {
            if (w.dueDate) {
              const due = `${w.dueDate.year}-${String(w.dueDate.month).padStart(2,'0')}-${String(w.dueDate.day).padStart(2,'0')}T23:59`;
              if (!tasks.some(t => t.title.includes(w.title))) {
                tasks.push({
                  id: 'gc-' + w.id,
                  title: `[Classroom] ${w.title}`,
                  subject: '情報/その他',
                  source: 'Google Classroom',
                  status: 'todo',
                  dueDate: due,
                  estTime: 30,
                  memo: w.alternateLink || ''
                });
              }
            }
          });
        }
        saveData();
        renderTasks();
        checkDueNotifications();
        alert('Google Classroomの提出課題が同期されました！');
      } catch (err) {
        alert('Classroom課題の取得に失敗しました。');
      }
    }
  </script>
</body>
</html>
