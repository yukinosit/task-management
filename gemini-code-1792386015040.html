<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduTask Hub Pro - 統合課題管理システム</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <!-- FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Google API Client & Identity Services (async/deferを外し順序を確保) -->
  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="https://apis.google.com/js/api.js"></script>

  <style>
    .fc-event { cursor: pointer; border-radius: 4px; padding: 2px 4px; font-size: 0.85rem; }
    /* Dynamic Status Backgrounds for Cards */
    .status-border-todo { border-left: 5px solid #ef4444; }
    .status-border-doing { border-left: 5px solid #f59e0b; }
    .status-border-submitted { border-left: 5px solid #3b82f6; }
    .status-border-done { border-left: 5px solid #10b981; }
    .status-border-overdue { border-left: 5px solid #7c3aed; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header & Main Navigation -->
  <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-graduation-cap text-2xl text-yellow-300"></i>
        <h1 class="text-xl font-bold tracking-wide">EduTask Hub Pro</h1>
      </div>

      <!-- Main Navigation Tabs -->
      <nav class="flex space-x-1 bg-indigo-800 p-1 rounded-lg text-sm font-medium">
        <button onclick="switchTab('tasks')" id="tab-tasks" class="tab-btn px-4 py-2 rounded-md bg-indigo-600 text-white shadow">
          <i class="fa-solid fa-list-check mr-2"></i>課題一覧・管理
        </button>
        <button onclick="switchTab('calendar')" id="tab-calendar" class="tab-btn px-4 py-2 rounded-md text-indigo-200 hover:text-white">
          <i class="fa-regular fa-calendar-days mr-2"></i>カレンダー
        </button>
        <button onclick="switchTab('integrations')" id="tab-integrations" class="tab-btn px-4 py-2 rounded-md text-indigo-200 hover:text-white relative">
          <i class="fa-solid fa-cloud-arrow-down mr-2"></i>外部連携・Google
        </button>
        <button onclick="switchTab('analytics')" id="tab-analytics" class="tab-btn px-4 py-2 rounded-md text-indigo-200 hover:text-white">
          <i class="fa-solid fa-chart-pie mr-2"></i>統計・レポート
        </button>
      </nav>

      <button onclick="openModal()" class="bg-amber-400 hover:bg-amber-300 text-indigo-950 font-bold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> 新規課題を追加
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

    <!-- SECTION 1: 課題一覧・管理 (Tasks View) -->
    <section id="section-tasks" class="tab-content block space-y-6">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
        <div class="flex flex-wrap gap-3 items-center w-full md:w-auto">
          <div class="relative w-full md:w-64">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
            <input type="text" id="searchQuery" oninput="renderTasks()" placeholder="課題名や教科で検索..." class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <select id="filterSubject" onchange="renderTasks()" class="border rounded-lg px-3 py-2 text-sm outline-none">
            <option value="ALL">全ての教科</option>
            <option value="数学">数学</option>
            <option value="英語">英語</option>
            <option value="国語">国語</option>
            <option value="理科">理科</option>
            <option value="社会">社会</option>
            <option value="情報/その他">情報/その他</option>
          </select>
          <select id="filterSource" onchange="renderTasks()" class="border rounded-lg px-3 py-2 text-sm outline-none">
            <option value="ALL">提出場所: すべて</option>
            <option value="Google Classroom">Google Classroom</option>
            <option value="Microsoft Teams">Microsoft Teams</option>
            <option value="手渡し・紙">手渡し・紙</option>
            <option value="その他Web">その他Web</option>
          </select>
        </div>

        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-500 font-bold">表示切替:</span>
          <button onclick="setViewMode('kanban')" id="btn-kanban" class="px-3 py-1.5 rounded-lg border text-sm bg-indigo-50 border-indigo-200 text-indigo-700 font-medium">カンバン</button>
          <button onclick="setViewMode('list')" id="btn-list" class="px-3 py-1.5 rounded-lg border text-sm bg-white border-slate-200 text-slate-600">リスト</button>
        </div>
      </div>

      <!-- KANBAN BOARD -->
      <div id="view-kanban" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-slate-200/60 p-3 rounded-xl">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-slate-700 flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full bg-red-500"></span>未着手</h3>
            <span id="count-todo" class="bg-white text-slate-600 px-2 py-0.5 rounded-full text-xs font-bold shadow-sm">0</span>
          </div>
          <div id="container-todo" class="space-y-3 min-h-[300px]"></div>
        </div>

        <div class="bg-slate-200/60 p-3 rounded-xl">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-slate-700 flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full bg-amber-500"></span>進行中</h3>
            <span id="count-doing" class="bg-white text-slate-600 px-2 py-0.5 rounded-full text-xs font-bold shadow-sm">0</span>
          </div>
          <div id="container-doing" class="space-y-3 min-h-[300px]"></div>
        </div>

        <div class="bg-slate-200/60 p-3 rounded-xl">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-slate-700 flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full bg-blue-500"></span>提出済み</h3>
            <span id="count-submitted" class="bg-white text-slate-600 px-2 py-0.5 rounded-full text-xs font-bold shadow-sm">0</span>
          </div>
          <div id="container-submitted" class="space-y-3 min-h-[300px]"></div>
        </div>

        <div class="bg-slate-200/60 p-3 rounded-xl">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-slate-700 flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full bg-emerald-500"></span>完了</h3>
            <span id="count-done" class="bg-white text-slate-600 px-2 py-0.5 rounded-full text-xs font-bold shadow-sm">0</span>
          </div>
          <div id="container-done" class="space-y-3 min-h-[300px]"></div>
        </div>
      </div>

      <!-- LIST VIEW -->
      <div id="view-list" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-slate-700 font-bold border-b">
            <tr>
              <th class="p-3">ステータス</th>
              <th class="p-3">教科</th>
              <th class="p-3">課題タイトル</th>
              <th class="p-3">提出場所</th>
              <th class="p-3">締切日時</th>
              <th class="p-3">予想時間</th>
              <th class="p-3 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="list-table-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>

    <!-- SECTION 2: カレンダー表示 -->
    <section id="section-calendar" class="tab-content hidden">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div id="calendar"></div>
      </div>
    </section>

    <!-- SECTION 3: 外部連携 -->
    <section id="section-integrations" class="tab-content hidden space-y-6">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-3 mb-4">
          <div class="p-3 bg-emerald-100 rounded-lg text-emerald-700">
            <i class="fa-brands fa-google text-2xl"></i>
          </div>
          <div>
            <h2 class="text-lg font-bold text-slate-800">Google Classroom 自動同期</h2>
            <p class="text-xs text-slate-500">Googleアカウントと接続し、決められた課題提出期限をリアルタイムで自動取得します。</p>
          </div>
        </div>

        <div class="space-y-4 bg-slate-50 p-4 rounded-lg border">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Google OAuth Client ID</label>
              <input type="text" id="g-client-id" placeholder="xxxxxx.apps.googleusercontent.com" class="w-full border p-2 rounded text-xs">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Google API Key</label>
              <input type="text" id="g-api-key" placeholder="AIzaSyXXXXXX" class="w-full border p-2 rounded text-xs">
            </div>
          </div>
          <div class="flex gap-3 items-center">
            <button onclick="handleAuthClick()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2">
              <i class="fa-solid fa-arrows-rotate"></i> Google Classroomと連携・同期
            </button>
            <span id="gc-status" class="text-xs font-medium text-slate-500">未接続</span>
          </div>
        </div>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <h3 class="font-bold text-slate-800 mb-2 flex items-center gap-2"><i class="fa-solid fa-file-import text-indigo-600"></i>ファイルからインポート</h3>
          <p class="text-xs text-slate-500 mb-4">JSONファイルを取り込みます。</p>
          <input type="file" id="importFile" accept=".json" onchange="importTasks(event)" class="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"/>
        </div>
        <div>
          <h3 class="font-bold text-slate-800 mb-2 flex items-center gap-2"><i class="fa-solid fa-file-export text-indigo-600"></i>データ出力</h3>
          <p class="text-xs text-slate-500 mb-4">保存された課題データをJSONとして保存します。</p>
          <button onclick="exportTasks()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-4 py-2 rounded-lg">
            <i class="fa-solid fa-download mr-1"></i>JSONとしてエクスポート
          </button>
        </div>
      </div>
    </section>

    <!-- SECTION 4: 統計 -->
    <section id="section-analytics" class="tab-content hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
          <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-chart-pie text-indigo-600"></i>課題状況の分布割合</h3>
          <div class="w-64 mx-auto"><canvas id="chart-status"></canvas></div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
          <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-chart-column text-indigo-600"></i>教科別の課題負荷</h3>
          <canvas id="chart-subject"></canvas>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div id="modalTask" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
      <div class="bg-indigo-700 px-6 py-4 text-white flex justify-between items-center">
        <h3 id="modalTitle" class="font-bold">新規課題の追加</h3>
        <button onclick="closeModal()" class="text-indigo-200 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="taskForm" onsubmit="saveTask(event)" class="p-6 space-y-4">
        <input type="hidden" id="taskId">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">課題タイトル *</label>
          <input type="text" id="taskTitle" required placeholder="例: 数学ワーク P.20-25" class="w-full border p-2 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">教科 *</label>
            <select id="taskSubject" required class="w-full border p-2 rounded-lg text-sm outline-none">
              <option value="数学">数学</option>
              <option value="英語">英語</option>
              <option value="国語">国語</option>
              <option value="理科">理科</option>
              <option value="社会">社会</option>
              <option value="情報/その他">情報/その他</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">提出場所</label>
            <select id="taskSource" class="w-full border p-2 rounded-lg text-sm outline-none">
              <option value="Google Classroom">Google Classroom</option>
              <option value="Microsoft Teams">Microsoft Teams</option>
              <option value="手渡し・紙">手渡し・紙</option>
              <option value="その他Web">その他Web</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-2">進行状況 *</label>
          <input type="hidden" id="taskStatus" value="todo">
          <div class="grid grid-cols-4 gap-2">
            <button type="button" onclick="setStatusSelect('todo')" id="btn-status-todo" class="status-select-btn border-2 rounded-lg p-2 text-center text-xs font-bold">
              <i class="fa-solid fa-circle-dot text-red-500 block text-base mb-1"></i>未着手
            </button>
            <button type="button" onclick="setStatusSelect('doing')" id="btn-status-doing" class="status-select-btn border-2 rounded-lg p-2 text-center text-xs font-bold">
              <i class="fa-solid fa-spinner text-amber-500 block text-base mb-1"></i>進行中
            </button>
            <button type="button" onclick="setStatusSelect('submitted')" id="btn-status-submitted" class="status-select-btn border-2 rounded-lg p-2 text-center text-xs font-bold">
              <i class="fa-solid fa-paper-plane text-blue-500 block text-base mb-1"></i>提出済み
            </button>
            <button type="button" onclick="setStatusSelect('done')" id="btn-status-done" class="status-select-btn border-2 rounded-lg p-2 text-center text-xs font-bold">
              <i class="fa-solid fa-check-double text-emerald-500 block text-base mb-1"></i>完了
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-
